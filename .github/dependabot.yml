# Pull requests for dependency updates, weekly, with minor and patch updates grouped into one PR per ecosystem to
# keep the noise down. Security updates come as soon as an advisory is published (enable "Dependabot security
# updates" under Settings -> Code security).
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories: [/app/src-tauri, /app/notify]
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # tauri-action v1 changes how the release is published (renamed inputs; latest.json download URLs become
    # rate-limited api.github.com asset URLs). Migrate on purpose, with a test release, then remove this rule.
    ignore:
      - dependency-name: tauri-apps/tauri-action
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns: ['*']
