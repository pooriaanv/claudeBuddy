name: Release

# Push a tag like v0.1.0 (matching app/src-tauri/tauri.conf.json "version") to test, build, sign and publish the
# Windows installer, the macOS app (universal .dmg, plus a smaller Apple Silicon-only .dmg), the Linux .deb and
# AppImage, and the updater manifest (latest.json) as a GitHub release. The jobs run one after another (windows ->
# macos -> linux): each adds its files to the same draft release and merges its platforms into latest.json.
# The release stays a draft (invisible to /releases/latest, so installed copies keep seeing the previous one) until
# the publish job has checked latest.json; only then is it published.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the version matches the tag
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tauri.conf.json version is $v but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$v" '/^## /{f=($2==v)} f' ../CHANGELOG.md | tail -n +2)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## $v' section"
            exit 1
          fi
          {
            echo 'body<<EOF_NOTES'
            echo "$notes"
            echo
            echo '---'
            echo 'Windows: download `ClaudeBuddy_*_x64-setup.exe` below and run it (per-user install, no admin).'
            echo
            echo 'Mac (macOS 14+): download `ClaudeBuddy_*_universal.dmg` (Apple Silicon and Intel) or the smaller `ClaudeBuddy_*_aarch64.dmg` (Apple Silicon only), open it and drag ClaudeBuddy to Applications. The app is not notarized: the first time, open it, then System Settings > Privacy & Security > Open Anyway.'
            echo
            echo 'Linux (x86_64, Ubuntu 22.04+ and similar): `ClaudeBuddy_*_amd64.AppImage` (make it executable and run it; updates itself) or `ClaudeBuddy_*_amd64.deb` (`sudo apt install ./ClaudeBuddy_*_amd64.deb`). Needs an X11 session or XWayland.'
            echo
            echo 'Installed copies update themselves.'
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test

      - name: Build, sign and upload (draft)
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: ClaudeBuddy ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          includeUpdaterJson: true
          args: '--config {"bundle":{"createUpdaterArtifacts":true}}'

  macos:
    needs: windows
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: npm ci
      - run: npm test

      # Ad-hoc signed (bundle.macOS.signingIdentity "-", like the Swift app), not notarized. The draft release and its
      # notes already exist (windows job); this adds the .dmg, the updater .app.tar.gz + .sig and the darwin entries.
      # By id: a draft is not found by its tag.
      - name: Build, sign and upload (draft)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.windows.outputs.release_id }}
          releaseDraft: true
          includeUpdaterJson: true
          args: '--target universal-apple-darwin --config {"bundle":{"createUpdaterArtifacts":true}}'

      # A smaller download for Apple Silicon: the .dmg only. No updater artifacts and latest.json untouched - installed
      # copies (either .dmg) update from the universal .app.tar.gz.
      - name: Build and upload the Apple Silicon .dmg (draft)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          releaseId: ${{ needs.windows.outputs.release_id }}
          releaseDraft: true
          includeUpdaterJson: false
          args: '--target aarch64-apple-darwin --bundles dmg'

  # After macOS on purpose: each job merges its platforms into the release's latest.json (download, merge, upload),
  # so two jobs at once could overwrite each other's entries.
  linux:
    needs: [windows, macos]
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Tauri's Linux build prerequisites (WebKitGTK 4.1, AppIndicator for the tray), patchelf for the AppImage.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - run: npm ci
      - run: npm test

      # Ubuntu 22.04 on purpose: the oldest supported glibc, so the .deb and the AppImage also run on newer distros.
      - name: Build, sign and upload (draft)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.windows.outputs.release_id }}
          releaseDraft: true
          includeUpdaterJson: true
          args: '--config {"bundle":{"createUpdaterArtifacts":true}}'

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      # A broken updater manifest can't be fixed for copies already installed: fail loudly unless latest.json has
      # every platform, each signed, the darwin entries pointing to the universal .app.tar.gz and Linux to the AppImage.
      - name: Check latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.windows.outputs.release_id }}
        run: |
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == "latest.json") | .url')
          if [ -z "$asset" ]; then echo "::error::the draft release has no latest.json"; exit 1; fi
          gh api -H "Accept: application/octet-stream" "$asset" > "$RUNNER_TEMP/latest.json"
          node -e '
            const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const p = m.platforms ?? {};
            let ok = true;
            for (const k of ["windows-x86_64", "darwin-aarch64", "darwin-x86_64", "linux-x86_64"]) {
              const e = p[k];
              if (!e || !e.url || !e.signature) { console.log(`::error::latest.json: ${k} missing url or signature`); ok = false; }
            }
            for (const k of ["darwin-aarch64", "darwin-x86_64"]) {
              if (p[k] && !/universal.*\.app\.tar\.gz$/.test(p[k].url)) { console.log(`::error::latest.json: ${k} is not the universal .app.tar.gz (${p[k].url})`); ok = false; }
            }
            if (p["linux-x86_64"] && !/\.AppImage$/.test(p["linux-x86_64"].url)) { console.log(`::error::latest.json: linux-x86_64 is not the AppImage (${p["linux-x86_64"].url})`); ok = false; }
            console.log("platforms:", Object.keys(p).join(", "));
            if (!ok) process.exit(1);
          ' "$RUNNER_TEMP/latest.json"

      # Only now does the release (and its latest.json) reach users.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.windows.outputs.release_id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true --silent
