name: Promote release

# The last step of a release, by hand (Actions > Promote release > Run workflow): turns a tested pre-release from
# release.yml into the latest release, which is what installed copies update from.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the tested pre-release, like v0.4.1
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Find the pre-release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          read -r id prerelease < <(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '"\(.id) \(.prerelease)"')
          if [ "$prerelease" != "true" ]; then echo "::error::$TAG is not a pre-release"; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Make it the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F prerelease=false -f make_latest=true --silent

      # GitHub has no "deprecated" flag for releases: put a notice at the top of every older published release that
      # points to the latest one. Idempotent (a marker comment); the files of old releases stay where they are.
      - name: Mark older releases as outdated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft | not) | {id, tag_name, body}' \
            | jq -c . > "$RUNNER_TEMP/releases.jsonl"
          while IFS= read -r rel; do
            id=$(jq -r .id <<<"$rel"); tag=$(jq -r .tag_name <<<"$rel")
            [ "$id" = "$RELEASE_ID" ] && continue
            if jq -r '.body // ""' <<<"$rel" | grep -q '<!-- outdated -->'; then continue; fi
            notice="<!-- outdated -->"$'\n'"> [!WARNING]"$'\n'"> **This version is outdated.** Download the [latest release](https://github.com/$GITHUB_REPOSITORY/releases/latest) instead — installed copies update themselves."
            body="$notice"$'\n\n'"$(jq -r '.body // ""' <<<"$rel")"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f body="$body" --silent
            echo "marked $tag as outdated"
          done < "$RUNNER_TEMP/releases.jsonl"
