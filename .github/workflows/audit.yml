name: Dependency audit

# Known vulnerabilities in the libraries we ship: npm (the page) and RustSec (the app and the hook helper).
# Fails on a published vulnerability; "unmaintained" / "unsound" advisories are reported as warnings only.
# On every change to a lockfile, on pull requests, and daily (new advisories appear without any change here).
on:
  push:
    branches: [main]
    paths: ['app/package-lock.json', 'app/src-tauri/Cargo.lock', 'app/notify/Cargo.lock', '.github/workflows/audit.yml']
  pull_request:
    paths: ['app/package-lock.json', 'app/src-tauri/Cargo.lock', 'app/notify/Cargo.lock', '.github/workflows/audit.yml']
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Runtime dependencies only: the dev tools (Vite, Vitest, the Tauri CLI) never reach users.
      - run: npm audit --omit=dev --audit-level=moderate

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit
      # Known, reviewed advisories without a stable fix yet - each one is unreachable in this app:
      # - RUSTSEC-2024-0429 (glib 0.18 VariantStrIter, unsound): Linux-only GTK3 stack under Tauri; nothing in the
      #   dependency tree calls VariantStrIter. Fixed in glib 0.20, which needs Tauri on GTK4.
      # Remove each ignore once Dependabot brings the fix.
      - name: App
        run: >-
          cargo audit --file app/src-tauri/Cargo.lock
          --ignore RUSTSEC-2024-0429
      - name: Hook helper
        run: cargo audit --file app/notify/Cargo.lock
